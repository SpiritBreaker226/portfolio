<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAFAF9" />
    <script>
      ;(function () {
        const osScheme = matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'

        let savedScheme = null

        // Safari private mode and blocked site data throw on storage access.
        try {
          savedScheme = localStorage.getItem('theme')
        } catch (error) {}

        const scheme =
          savedScheme === 'light' || savedScheme === 'dark'
            ? savedScheme
            : osScheme

        document.documentElement.dataset.theme = scheme
        document.documentElement.style.colorScheme = scheme

        // Same hexes as `bg` in src/theme/theme.ts, which this inline script
        // can't import.
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', scheme === 'dark' ? '#111417' : '#FAFAF9')
      })()
    </script>
    <!-- Same hexes as `bg` in src/theme/theme.ts, so the first paint
         already matches the theme the app renders. -->
    <style>
      html {
        background: #FAFAF9;
      }

      html[data-theme='dark'] {
        background: #111417;
      }
    </style>

    <meta
      name="description"
      content="Jason is a Vancouver-based developer who is a quick learner and always challenges himself to learn and stay on top of new technology developments." />
    <meta name="author" content="Jason Stathopulos" />

    <meta
      property="og:title"
      content="Jason Stathopulos: Talented, Focused, Experienced" />
    <meta
      property="og:description"
      content="Jason is a Vancouver-based developer who is a quick learner and always challenges himself to learn and stay on top of new technology developments." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jstats.me/" />
    <meta property="og:image" content="/logo317.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="317" />
    <meta property="og:image:height" content="200" />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="/manifest.json" />
    <title>Jason Stathopulos: Talented, Focused, Experienced</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
